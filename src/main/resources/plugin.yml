# EssentialsX metrics: player inactivity and money in circulation.
#
# One jar, one integration. Removing it removes these metrics and nothing else;
# if it crashes, it crashes alone. That's what "depend" guarantees: without the
# core or without EssentialsX, Bukkit refuses to load this plugin and says so
# clearly, instead of letting a collector fail silently on every scrape.
name: VaniaMetrics-Essentials
version: ${version}
main: fr.samflix.vaniametrics.module.essentials.EssentialsPaper
api-version: '1.21'
authors: [mc-vania]
description: "EssentialsX metrics: player inactivity and money in circulation."
depend: [VaniaMetrics, Essentials]
